name: Deploy to GitHub Pages

# Replaces the legacy branch-based ("dynamic") Pages build. That path only
# ever published whichever branch was named in Settings, so merges to main
# didn't deploy, and its runs couldn't be re-run or cancelled when they stalled.
# A real workflow deploys on every push to main and can be re-run like any other.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets a stuck or skipped deploy be re-triggered by hand

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs collapse to the newest, so a burst of
# merges can't pile up — but an in-flight deploy is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always publish main, even when dispatched manually from another
      # branch — "deploy the site" should never mean "deploy whatever branch
      # happened to be selected in the dropdown".
      - uses: actions/checkout@v4
        with:
          ref: main

      # enablement lets the action switch Pages to the "GitHub Actions" build
      # type itself. Without it the first run fails on a repo still set to
      # "Deploy from a branch", because there's no Actions-based Pages site to
      # configure yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static files with no build step, so the repo root is
      # the artifact. Jekyll would otherwise ignore files and folders starting
      # with an underscore; .nojekyll turns that off.
      - name: Disable Jekyll processing
        run: touch .nojekyll

      # Assets are referenced as "app.js?v=dev" in the repo; stamping the
      # commit sha here means every deploy requests different URLs, so a
      # browser holding an old copy can't serve stale JS or CSS alongside a
      # freshly fetched index.html. Without this, adding a new script file
      # is invisible until the cached HTML happens to expire.
      - name: Cache-bust assets with the deployed commit
        run: |
          sha="${GITHUB_SHA:0:8}"
          sed -i "s/?v=dev/?v=$sha/g" index.html
          echo "Stamped asset URLs with ?v=$sha"
          grep -o 'src="[^"]*?v=[^"]*"' index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
